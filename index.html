<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Aura Home - Widgets</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Barra superior de promoción -->
  <div class="promo-bar" id="promoBar">
    <p>🚚 Envío gratis en compras mayores a $50.000 | <strong>Usá el código: AURA10</strong> para 10% off</p>
    <button class="promo-close" onclick="document.getElementById('promoBar').style.display='none'">✕</button>
  </div>

  <!-- Popup de descuento -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-box">
      <button class="popup-close" onclick="closePopup()">✕</button>
      <div class="popup-content">
        <p class="popup-subtitle">Bienvenida a</p>
        <h2 class="popup-title">AURA HOME</h2>
        <p class="popup-offer">10% OFF</p>
        <p class="popup-desc">en tu primera compra</p>
        <p class="popup-code">Código: <strong>AURA10</strong></p>
        <button class="popup-btn" onclick="closePopup()">¡Lo quiero!</button>
        <p class="popup-skip" onclick="closePopup()">No gracias</p>
      </div>
    </div>
  </div>

  <!-- Botón flotante WhatsApp -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css">
  <a href="https://api.whatsapp.com/send?phone=5195508107&text=Hola%21%20Quisiera%20m%C3%A1s%20informaci%C3%B3n%20sobre%20Aura%20Home."
    class="float" target="_blank" title="Contactanos por WhatsApp">
    <i class="fa fa-whatsapp my-float"></i>
  </a>

  <script>
    // Mostrar popup después de 4 segundos
    setTimeout(function () {
      var visited = localStorage.getItem('aura_popup_seen');
      if (!visited) {
        document.getElementById('popupOverlay').classList.add('active');
      }
    }, 4000);

    function closePopup() {
      document.getElementById('popupOverlay').classList.remove('active');
      localStorage.setItem('aura_popup_seen', 'true');
    }

    // Cerrar popup al hacer click fuera
    document.getElementById('popupOverlay').addEventListener('click', function (e) {
      if (e.target === this) closePopup();
    });
  </script>

</body>

</html>
